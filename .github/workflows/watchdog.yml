name: TF Watchdog 5-min ping

# Echter 5-Minuten-Takt als selbst verlaengernde Kette (Masterplan 16.10.2026, Paket W).
#
# Jedes Glied pingt ~5h40m alle 5 Min (scripts/kette.sh) und startet am Ende das
# naechste per Dispatch (scripts/weiter.sh) — mit dem Entprellzustand als Input,
# damit ein laufender Alarm nicht neu gemeldet und eine Entwarnung nicht
# verschluckt wird.
#
# KEIN schedule hier, absichtlich: bei `concurrency` verdraengt ein neuer Lauf
# einen schon wartenden. Ein Schedule-Lauf koennte so das Folgeglied MIT Zustand
# ersetzen. Den Neustart nach einem Riss macht heiler.yml (eigene Gruppe), das
# Melden eines Risses der Totmannschalter (healthchecks.io, Secret HC_UUID).
#
# Befund 16.10.: Bis dahin hat sich die Kette NIE selbst verlaengert —
# `gh workflow run` lief ohne -R und ohne Checkout ("not a git repository"),
# `|| true` hat es verschluckt. 32 Luecken > 6 min in 1038 h, groesste 231 min.
#
# KETTE ANHALTEN: Ein Abbruch in der Oberflaeche reicht NICHT — "Kette fortsetzen"
# laeuft mit always() und startet das naechste Glied. Anhalten nur mit
#   gh workflow disable watchdog.yml -R VantixAgency/tf-watchdog
#   gh workflow disable heiler.yml   -R VantixAgency/tf-watchdog
# Wieder an: beide `enable`, dann `gh workflow run watchdog.yml -R VantixAgency/tf-watchdog`.

on:
  workflow_dispatch:
    inputs:
      zustand:
        description: "Entprellzustand je Organisation (JSON), vom vorigen Glied"
        required: false
        default: "{}"

permissions:
  actions: write # Dispatch des Folgeglieds und run list
  contents: read

concurrency:
  group: tf-watchdog-chain
  cancel-in-progress: false # nie das laufende Glied abbrechen; max. 1 wartendes

env:
  ORGS: tattoo-fashion # Staging bewusst nicht im Takt (Fehlkonfiguration, siehe Masterplan W2)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Alle 5 Minuten den Watchdog anstossen
        # Schritt-Timeout statt nur Job-Timeout: so laeuft "Kette fortsetzen" immer
        # noch innerhalb des Job-Limits (Review H27). 20400 s Schleife = 340 min.
        timeout-minutes: 344
        env:
          KEY: ${{ secrets.WATCHDOG_KEY }}
          HC_UUID: ${{ secrets.HC_UUID }}
          ZUSTAND: ${{ inputs.zustand }}
          ZUSTAND_AUS: ${{ runner.temp }}/zustand.json
        run: bash scripts/kette.sh
      - name: Kette fortsetzen (Folgeglied starten und belegen)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ZUSTAND_DATEI: ${{ runner.temp }}/zustand.json
        run: |
          ZUSTAND=$(cat "$ZUSTAND_DATEI" 2>/dev/null || echo '{}') bash scripts/weiter.sh
