name: TF Watchdog 5-min ping

# Echter 5-Minuten-Takt trotz GitHub-Schedule-Drosselung: der Job pingt in einer
# Schleife alle 5 Min (~5h40m lang) und triggert sich am Ende selbst neu
# (Self-Chain). Der 6h-Schedule ist nur Sicherheits-Neustart, falls die Kette je
# abreißt. Läuft extern auf GitHub (nicht auf dem überwachten n8n-Server).
# Kostenlos, weil das Repo öffentlich ist (unbegrenzte Actions-Minuten).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

permissions:
  actions: write # für Self-Re-Dispatch via gh

concurrency:
  group: tf-watchdog-chain
  cancel-in-progress: false # nie den laufenden Ping-Job abbrechen; max. 1 pending

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~5h50m, dann übernimmt das nächste Kettenglied
    steps:
      - name: Alle 5 Minuten den Watchdog anstoßen (mit Alarm-Entprellung)
        env:
          KEY: ${{ secrets.WATCHDOG_KEY }}
        run: |
          set +e
          BASE="https://tf-watchdog.vercel.app/api/check"
          END=$(( $(date +%s) + 20400 ))   # ~5h40m aktiv pingen
          # Zustandsgedächtnis: verhindert die 10-Mail-Flut. Der Endpoint mailt nur,
          # wenn sich das Problem ÄNDERT, alle 2h erneut (Erinnerung), oder bei Entwarnung.
          prev="OK"        # zuletzt gesehener Fingerprint (Startannahme: gesund)
          alerted_fp="OK"  # Fingerprint, über den zuletzt WIRKLICH gemailt wurde
          last_alert=0     # Unix-ts der letzten wirklich gesendeten Alarm-Mail
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            now=$(date +%s)
            sinceAlert=$(( now - last_alert ))
            resp=$(curl -fsS -m 25 --get "$BASE" \
              --data-urlencode "key=${KEY}" \
              --data-urlencode "prev=${prev}" \
              --data-urlencode "alertedFp=${alerted_fp}" \
              --data-urlencode "sinceAlert=${sinceAlert}")
            if [ $? -ne 0 ] || [ -z "$resp" ]; then
              echo "$(date -u +%H:%M:%S) ping#$n -> CURL_FAIL (Vercel-Endpoint nicht erreichbar)"
              sleep 300; continue
            fi
            fp=$(printf '%s' "$resp" | jq -r '.fp // "OK"')
            didAlert=$(printf '%s' "$resp" | jq -r '(.alerted.problem // false)')
            didResolve=$(printf '%s' "$resp" | jq -r '(.alerted.resolved // false)')
            # Gedächtnis, worüber wirklich gemailt wurde. Ohne das käme entweder eine
            # Mail-Flut oder eine Entwarnung für ein nie gemeldetes Problem.
            if [ "$didAlert" = "true" ]; then last_alert=$now; alerted_fp="$fp"; fi
            [ "$didResolve" = "true" ] && alerted_fp="OK"
            echo "$(date -u +%H:%M:%S) ping#$n -> fp=${fp} alert=${didAlert} gemeldet=${alerted_fp}"
            prev="$fp"
            sleep 300
          done
      - name: Kette fortsetzen (Self-Re-Dispatch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog.yml || true
